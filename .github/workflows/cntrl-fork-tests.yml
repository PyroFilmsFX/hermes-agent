# cntrl fork only: full per-file suite on free GitHub-hosted runners, sliced 4 ways.
# Upstream's tests.yml is workflow_call-only on a 96-core org runner a personal fork doesn't
# have. Push triggers work from any branch that carries this file; enabling Actions on the fork
# and switching its default branch are owner decisions (manager relay, 2026-09-25).
name: cntrl fork tests

on:
  push:
    branches: [cntrl-hermes, cntrl-hermes-worker, "sync/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cntrl-fork-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.repository == 'PyroFilmsFX/hermes-agent'
    name: Tests (slice ${{ matrix.slice }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        slice: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Mirrors upstream tests.yml's test job: a pinned prebuilt ripgrep and the locked PM
      # toolchain with a hermetic test environment (scripts/run_tests.sh runs the suite in
      # that env, not .venv), plus the fork's Claude Agent SDK extra.
      - name: Install ripgrep (prebuilt binary)
        run: |
          set -euo pipefail
          RG_VERSION=15.1.0
          RG_SHA256=1c9297be4a084eea7ecaedf93eb03d058d6faae29bbc57ecdaf5063921491599
          RG_TARBALL=ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl.tar.gz
          curl -sSfL --retry 3 --retry-delay 5 -o "$RG_TARBALL" \
            "https://github.com/BurntSushi/ripgrep/releases/download/${RG_VERSION}/${RG_TARBALL}"
          echo "${RG_SHA256}  ${RG_TARBALL}" | sha256sum -c -
          tar -xzf "$RG_TARBALL"
          sudo mv "ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl/rg" /usr/local/bin/rg
          rm -rf "$RG_TARBALL" "ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl"
          rg --version

      - name: Set up locked Python and test dependencies
        uses: ./.github/actions/setup-pm
        with:
          extras: '["all", "anthropic", "bedrock", "mistral", "fal", "modal", "daytona", "parallel-web", "claude-agent-sdk"]'
          test-environment: 'true'
          prune-python-cache: true

      - name: Run tests
        run: |
          scripts/run_tests.sh
        env:
          HERMES_TEST_SLICE: ${{ matrix.slice }}/4
          HERMES_TEST_WORKERS: "4"
